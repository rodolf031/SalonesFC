<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscador de Espacios FC</title>
    <link rel="icon" type="image/png" href="icono.png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <h1>Disponibilidad de salones</h1>
            <p>Facultad de Ciencias</p>
        </header>

        <section class="filters-section">
            <div class="filter-group">
                <h3>1. Selecciona Edificios</h3>
                <div class="chips-container" id="container-edificios">
                    </div>
            </div>

            <div class="filter-group">
                <h3>2. Define el Horario</h3>
                
                <div class="time-controls">
                    <div class="control-item">
                        <label>Día:</label>
                        <select id="select-dia" class="dark-select">
                            <option value="">Elige un día...</option>
                            <option value="Lunes">Lunes</option>
                            <option value="Martes">Martes</option>
                            <option value="Miércoles">Miércoles</option>
                            <option value="Jueves">Jueves</option>
                            <option value="Viernes">Viernes</option>
                            <option value="Sábado">Sábado</option>
                        </select>
                    </div>

                    <div class="range-wrapper">
                        <div class="control-item">
                            <label>Hora Inicio:</label>
                            <select id="select-inicio" class="dark-select"></select>
                        </div>
                        <div class="control-item">
                            <label>Hora Fin:</label>
                            <select id="select-fin" class="dark-select"></select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons-row">
                <button id="btn-limpiar" class="secondary-btn">Limpiar</button>
                <button id="btn-buscar" class="action-btn">BUSCAR SALONES</button>
            </div>
        </section>

        <main class="results-section">
            <div class="results-header">
                <h2 id="titulo-resultados">Configura tu búsqueda</h2>
                <span id="contador-resultados" class="badge hidden">0</span>
            </div>
            <p class="hint-text hidden" id="hint-click">Toca una tarjeta para ver el horario completo</p>
            <div id="lista-resultados" class="cards-list"></div>
        </main>
    </div>

    <div id="modal-horario" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modal-titulo"></h3>
            <p id="modal-subtitulo"></p>
            <div class="table-container">
                <table id="tabla-horario">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>L</th>
                            <th>M</th>
                            <th>M</th>
                            <th>J</th>
                            <th>V</th>
                            <th>S</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
